os: osx
osx_image: xcode16.2
language: swift

branches:
  only:
    - main

before_install:
  - gem install xcpretty --no-document
  - brew install xcodegen

script:
  - xcodegen generate
  - set -o pipefail && xcodebuild clean build
      -project MovieApp.xcodeproj
      -scheme MovieApp
      -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest'
      CODE_SIGNING_ALLOWED=NO
      | xcpretty
