name: MovieApp
options:
  bundleIdPrefix: com.fahmi.movieapp
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  Swinject:
    url: https://github.com/Swinject/Swinject.git
    from: 2.9.1

targets:
  MovieApp:
    type: application
    platform: iOS
    sources:
      - path: MovieApp
    resources:
      - path: MovieApp/Resources/Assets.xcassets
      - path: MovieApp/Data/Persistence/MovieApp.xcdatamodeld
    dependencies:
      - package: Swinject
    info:
      path: MovieApp/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: MovieApp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fahmi.movieapp
        SWIFT_VERSION: 5.0
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: MovieApp/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  MovieApp:
    build:
      targets:
        MovieApp: all
    run:
      config: Debug
    archive:
      config: Release
